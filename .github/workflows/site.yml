name: site

# Checks this repo. It deploys nothing and holds no secrets: getfort.io is built and
# deployed by Cloudflare Workers Builds from the Fort repo, which pins a commit of this
# repo (docs/site/_build/SITE_VERSION there). See docs/DEPLOY.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

# bash -eo pipefail: a failed command in a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit and end-to-end tests
        run: python3 -m unittest discover -s build/tests -v

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Scripts parse
        run: for file in *.js docs/*.js; do node --check "$file"; done

      - name: Locked wrangler installs
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/wrangler --version
